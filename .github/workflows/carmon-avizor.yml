name: Carmon Tradegar · avizor (Coinalyze)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  avizor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Traer derivados agregados (Coinalyze)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: node coinalyze-avizor.mjs
      - name: Guardar avizor.json
        run: |
          git config user.name  "carmon-bot"
          git config user.email "bot@carmontradegar.local"
          git add avizor.json
          git commit -m "avizor: actualización $(date -u +%FT%TZ)" || echo "sin cambios"
          git push
