name: Carmon Tradegar · avizor (Coinalyze)
 
on:
  schedule:
    - cron: "11 * * * *"   # cada hora, minuto :11 (fuera del pico del minuto 0 → menos saltos)
  workflow_dispatch: {}     # botón "Run workflow" para lanzarlo a mano
 
permissions:
  contents: write
 
concurrency:
  group: carmon-avizor
  cancel-in-progress: false
 
jobs:
  avizor:
    runs-on: ubuntu-latest
    timeout-minutes: 35     # corta la corrida si se cuelga (evita que se vaya a horas)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Traer derivados agregados (Coinalyze)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: node coinalyze-avizor.mjs
      - name: Guardar avizor.json
        run: |
          git config user.name  "carmon-bot"
          git config user.email "bot@carmontradegar.local"
          git add avizor.json
          git commit -m "avizor: actualización $(date -u +%FT%TZ)" || { echo "sin cambios"; exit 0; }
          git pull --rebase origin main || true
          git push
