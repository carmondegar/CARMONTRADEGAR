name: Bambu datos diarios

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Traer datos del dia
        working-directory: automatizacion
        env:
          CHARTINSPECT_API_KEY: ${{ secrets.CHARTINSPECT_API_KEY }}
        run: node fetch-chartinspect.mjs

      - name: Reconstruir archivos de datos
        working-directory: automatizacion
        run: node build-datos.mjs

      - name: Guardar cambios
        run: |
          git config user.name "bambu-bot"
          git config user.email "bot@bambu.local"
          git add app/btc_real.js app/eth_real.js app/history.js
          git commit -m "datos actualizacion automatica" || echo "sin cambios"
          git push
